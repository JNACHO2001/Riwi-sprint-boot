services:
  # Servicio de la aplicación Spring Boot
  app:
    build: .
    container_name: riwi-sprint-boot-app
    ports:
      - "8080:8080" # Mapea el puerto 8081
    depends_on:
      - mysqldb
      - mongodb
    environment:
      # Configuración de conexión para MySQL
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/db_users_hexagonal?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      # Configuración de conexión para MongoDB
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/db_venues_mongo
      # Configuración de JPA
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      # Flyway
      SPRING_FLYWAY_ENABLED: "true"
    networks:
      - riwi-network

  # Servicio de Base de Datos MySQL
  mysqldb:
    image: mysql:8.0
    container_name: riwi-mysql-db
    ports:
      - "3308:3306" # Mapea al puerto 3308 para evitar conflictos
    environment:
      MYSQL_DATABASE: db_users_hexagonal
      MYSQL_ROOT_PASSWORD: 123456
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - riwi-network

  # Servicio de Base de Datos MongoDB
  mongodb:
    image: mongo:latest
    container_name: riwi-mongo-db
    ports:
      - "27018:27017" # Mapea el puerto 27017 del contenedor al 27018 del host
    volumes:
      - mongo_data:/data/db
    networks:
      - riwi-network

# Definición de redes
networks:
  riwi-network:
    driver: bridge

# Definición de volúmenes
volumes:
  mysql_data:
  mongo_data:
